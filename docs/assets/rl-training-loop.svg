<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
  <title id="title">From financial research papers to GRPO training</title>
  <desc id="desc">Research papers become reviewed tasks with data contracts, metrics, verifiers, and Docker environments. The Qwen policy sends commands to the environment and receives tool observations. A separate verifier scores submitted outputs against hidden targets. The selected metric supplies rewards to rollout groups; GRPO uses those groups to update the policy. Held-out task success improved from 61 of 100 to 75 of 100.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 L 2 4 Z" fill="#50545a"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #25282d; text-anchor: middle; }
      .label { font-size: 16px; }
      .detail { font-size: 13px; fill: #4b5057; }
      .annotation { font-size: 12px; fill: #62676f; }
      .edge { fill: none; stroke: #50545a; stroke-width: 1.35; stroke-linejoin: round; marker-end: url(#arrow); }
      .node { stroke: #62666b; stroke-width: 1; filter: url(#shadow); }
      .blue { fill: #e4edf5; }
      .purple { fill: #e9deeb; }
      .peach { fill: #fff0d9; }
      .green { fill: #e0eedc; }
    </style>
  </defs>

  <rect width="1120" height="510" rx="10" fill="#ffffff"/>

  <!-- The dashed boundary groups the policy and its training trajectories. -->
  <rect x="245" y="143" width="265" height="215" rx="7" fill="none" stroke="#a4a8af" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Interaction: commands travel out; tool observations return to the policy. -->
  <path class="edge" d="M 425 173 V 125 H 620"/>
  <path class="edge" d="M 750 125 H 1010 V 168"/>
  <path class="edge" d="M 1090 201 H 1105 V 49 H 750"/>
  <path class="edge" d="M 620 49 H 330 V 173"/>

  <!-- Learning: verifier metrics become rewards for grouped rollouts. -->
  <path class="edge" d="M 990 234 V 309 H 960"/>
  <path class="edge" d="M 805 309 H 750"/>
  <path class="edge" d="M 620 309 H 460"/>
  <path class="edge" d="M 377.5 227 V 281"/>
  <path class="edge" d="M 295 309 H 195"/>
  <path class="edge" d="M 110 275 V 200 H 300"/>
  <text x="200" y="190" class="annotation">Policy update</text>
  <text x="427" y="257" class="annotation">Trajectories</text>
  <text x="565" y="298" class="annotation">Learning signal</text>
  <text x="1023" y="274" class="annotation">Outputs</text>

  <!-- Paper-derived environments are built before training or evaluation. -->
  <path class="edge" d="M 200 440 H 270"/>
  <path class="edge" d="M 525 440 H 1060 V 234"/>
  <text x="780" y="430" class="detail">Build task environments</text>

  <ellipse class="node blue" cx="110" cy="309" rx="85" ry="34"/>
  <text x="110" y="305" class="label">GRPO</text>
  <text x="110" y="323" class="detail">optimizer</text>

  <rect class="node purple" x="300" y="173" width="155" height="54" rx="7"/>
  <text x="377.5" y="195" class="label">Policy</text>
  <text x="377.5" y="215" class="detail">Qwen3.8-27B</text>

  <rect class="node purple" x="295" y="281" width="165" height="56" rx="7"/>
  <text x="377.5" y="305" class="label">Rollout group</text>
  <text x="377.5" y="324" class="detail">Actions + rewards</text>
  <text x="377.5" y="378" class="detail">Prime-RL + Verifiers</text>

  <rect class="node peach" x="620" y="25" width="130" height="48" rx="6"/>
  <text x="685" y="45" class="label">Observation</text>
  <text x="685" y="62" class="detail">Tool output</text>

  <rect class="node peach" x="620" y="101" width="130" height="48" rx="6"/>
  <text x="685" y="121" class="label">Action</text>
  <text x="685" y="138" class="detail">Commands</text>

  <rect class="node green" x="930" y="168" width="160" height="66" rx="7"/>
  <text x="1010" y="195" class="label">Environment</text>
  <text x="1010" y="216" class="detail">Task in Docker</text>

  <rect class="node purple" x="805" y="281" width="155" height="56" rx="7"/>
  <text x="882.5" y="305" class="label">Separate verifier</text>
  <text x="882.5" y="324" class="detail">Hidden targets</text>

  <rect class="node peach" x="620" y="281" width="130" height="56" rx="6"/>
  <text x="685" y="305" class="label">Reward</text>
  <text x="685" y="324" class="detail">Metric + direction</text>

  <rect class="node blue" x="35" y="414" width="165" height="52" rx="7"/>
  <text x="117.5" y="446" class="label">Research papers</text>

  <rect class="node blue" x="270" y="405" width="255" height="70" rx="7"/>
  <text x="397.5" y="434" class="label">Generate and review tasks</text>
  <text x="397.5" y="456" class="detail">Data contracts · metrics · verifiers</text>

  <text x="560" y="499" class="detail">Held-out evaluation: baseline 61/100 → GRPO 75/100 tasks solved</text>
</svg>
